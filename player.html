<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1a1a;
      --surface: #252525;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #ff0000;
      --accent-hover: #cc0000;
      --border: #333;
      --highlight: #2a2a2a;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --accent: #cc0000;
      --accent-hover: #990000;
      --border: #e2e8f0;
      --highlight: #fef2f2;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 2rem;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }

    .container { max-width: 1280px; margin: 0 auto; padding: 1.5rem 0; }

    @media (min-width: 1600px) {
      .container { max-width: 1440px; }
    }

    .header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .header-brand {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent);
      font-weight: 700;
      font-size: 1.25rem;
    }

    .logo svg { width: 28px; height: 28px; flex-shrink: 0; }

    .badge {
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }

    .header-title {
      font-size: 0.875rem;
      font-weight: 400;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.4;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 600px) {
      .stats-row { grid-template-columns: 1fr; }
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }

    .stat-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem; }
    .stat-value { font-size: 1.25rem; font-weight: 600; }

    .watch-row {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 767px) {
      body { padding: 0 1rem; }
    }

    .video-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    #player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #player iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .video-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .video-meta a { color: var(--accent); text-decoration: none; }
    .video-meta a:hover { text-decoration: underline; }

    .theme-toggle {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }

    .theme-toggle svg { width: 20px; height: 20px; }
    .theme-toggle .icon-moon { display: none; }
    .theme-toggle .icon-sun { display: block; }
    [data-theme="light"] .theme-toggle .icon-sun { display: none; }
    [data-theme="light"] .theme-toggle .icon-moon { display: block; }
    .theme-toggle:hover { background: var(--highlight); }
    .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .file-notice {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-size: 0.85rem;
      text-align: center;
    }

    .file-notice code {
      background: rgba(255,255,255,0.2);
      padding: 0.2em 0.4em;
      border-radius: 4px;
    }

    .transcript-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    .transcript-card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 0.75rem 0;
      color: var(--text);
    }

    .transcript-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .lang-segmented {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface);
    }

    .lang-segmented button {
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 500;
      border: none;
      border-right: 1px solid var(--border);
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .lang-segmented button:last-child {
      border-right: none;
    }

    .lang-segmented button:hover {
      color: var(--text);
      background: var(--highlight);
    }

    .lang-segmented button.active {
      background: var(--highlight);
      color: var(--accent);
    }

    .lang-segmented button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .transcript-area {
      flex: 1;
      min-height: 6rem;
      padding: 1rem;
      background: var(--bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .sub-toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .sub-search {
      flex: 1;
      min-width: 200px;
      padding: 0.5rem 0.75rem;
      font-size: 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }

    .sub-search::placeholder { color: var(--text-muted); }

    .sub-lang-group {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface);
    }

    .sub-lang-btn {
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
      font-weight: 500;
      border: none;
      border-right: 1px solid var(--border);
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .sub-lang-btn:last-child {
      border-right: none;
    }

    .sub-lang-btn:hover { color: var(--text); background: var(--highlight); }
    .sub-lang-btn.active {
      background: var(--highlight);
      color: var(--accent);
    }
    .sub-lang-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    .transcript-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .transcript-item {
      display: flex;
      gap: 1rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      align-items: flex-start;
    }

    .transcript-item:last-child { border-bottom: none; }
    .transcript-item:hover { background: var(--highlight); }

    .transcript-item.current {
      background: var(--highlight);
    }

    .transcript-item.current .transcript-ts { color: var(--accent); }

    .transcript-ts {
      flex-shrink: 0;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-muted);
      min-width: 3.5rem;
    }

    .transcript-text {
      flex: 1;
      min-width: 0;
    }

    .transcript-text .line-en {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.5;
    }

    .transcript-text .line-vi {
      font-size: 0.9rem;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.5;
      margin-top: 0.2rem;
    }

    .transcript-line {
      font-size: 0.95rem;
      color: var(--text);
      margin-bottom: 0.35rem;
      line-height: 1.5;
      cursor: pointer;
    }

    .transcript-line:hover { color: var(--accent); }
    .transcript-line.dim { opacity: 0.6; }
    .transcript-line.current {
      font-weight: 500;
      color: var(--accent);
      transform: scale(1.02);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      background: var(--highlight);
      padding: 0.25rem 0.5rem;
      margin: 0 -0.5rem 0.35rem -0.5rem;
      border-radius: 6px;
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .tab {
      padding: 0.75rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 500;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      margin-bottom: -1px;
    }

    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .summary-card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 1rem 0;
      color: var(--text);
    }

    .summary-text {
      color: var(--text);
      font-size: 0.95rem;
      max-height: 420px;
      overflow-y: auto;
    }

    .summary-overview {
      margin-bottom: 1.25rem;
      line-height: 1.65;
      max-width: 72ch;
    }

    .summary-overview p {
      margin: 0 0 0.85rem 0;
    }

    .summary-overview p:last-child {
      margin-bottom: 0;
    }

    .summary-overview .summary-list {
      margin: 0.75rem 0;
      padding-left: 1.25rem;
    }

    .summary-overview .summary-list li {
      margin-bottom: 0.5rem;
      line-height: 1.55;
    }

    .summary-highlights {
      margin: 0;
      padding-left: 1.25rem;
    }

    .summary-highlights li {
      margin-bottom: 0.5rem;
    }

    .highlight-ts {
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .highlight-ts:hover {
      color: var(--accent);
    }

    .empty {
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>
<body>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let transcriptData = [];
    let player;
    let pollInterval;
    let meta = null;

    function formatDurationShort(sec) {
      if (!sec) return '—';
      const mins = Math.floor((sec + 29) / 60);
      return mins + ' phút';
    }

    function formatPublishedAt(isoStr) {
      if (!isoStr) return '';
      try {
        const dt = new Date(isoStr.replace('Z', '+00:00'));
        const months = ['tháng 1', 'tháng 2', 'tháng 3', 'tháng 4', 'tháng 5', 'tháng 6',
          'tháng 7', 'tháng 8', 'tháng 9', 'tháng 10', 'tháng 11', 'tháng 12'];
        return dt.getDate() + ' ' + months[dt.getMonth()] + ', ' + dt.getFullYear();
      } catch (e) { return isoStr; }
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s || '';
      return div.innerHTML;
    }

    function formatSummaryWithList(text) {
      if (!text) return '';
      const paras = text.split(/\n\n+/);
      return paras.map(p => {
        const lines = p.split('\n');
        const listLines = lines.filter(l => /^[-•]\s/.test(l.trim()));
        if (listLines.length > 0) {
          const introLines = [];
          for (const l of lines) {
            if (/^[-•]\s/.test(l.trim())) break;
            introLines.push(l);
          }
          const intro = introLines.join('\n').trim();
          const items = listLines.map(l => l.replace(/^[-•]\s*/, '').replace(/^\(\d+\)\s*/, '').trim());
          let out = '';
          if (intro) out += '<p>' + escapeHtml(intro).replace(/\n/g, '<br>') + '</p>';
          out += '<ul class="summary-list">' + items.map(i => '<li>' + escapeHtml(i) + '</li>').join('') + '</ul>';
          return out;
        }
        return '<p>' + escapeHtml(p).replace(/\n/g, '<br>') + '</p>';
      }).join('');
    }

    function makeHighlightLi(h) {
      const m = h.match(/\[(\d{1,2}):(\d{2})\]/);
      if (m) {
        const mins = parseInt(m[1], 10), secs = parseInt(m[2], 10);
        const tsSec = mins * 60 + secs;
        const before = h.substring(0, m.index);
        const tsStr = m[0];
        const after = h.substring(m.index + m[0].length);
        return '<li><span class="highlight-ts" data-seek="' + tsSec + '" role="button" tabindex="0">' + escapeHtml(before) + '<strong>' + escapeHtml(tsStr) + '</strong>' + escapeHtml(after) + '</span></li>';
      }
      return '<li>' + escapeHtml(h) + '</li>';
    }

    function getBasePath() {
      const params = new URLSearchParams(location.search);
      const dir = params.get('dir') || '';
      return dir ? '/' + dir.replace(/^\/+|\/+$/g, '') + '/' : '';
    }

    async function init() {
      const base = getBasePath();
      if (!base) {
        document.body.innerHTML = '<div class="container" style="padding:2rem"><p>Thiếu tham số <code>?dir=output/xxx</code>. Ví dụ: <a href="?dir=output/how-to-learn-and-master-a-new-skill-_ySbzVXiwzQ">?dir=output/how-to-learn-and-master-a-new-skill-_ySbzVXiwzQ</a></p></div>';
        return;
      }
      meta = await fetch(base + 'metadata.json').then(r => r.json());
      try {
        transcriptData = await fetch(base + 'transcript_vi.json').then(r => r.json());
      } catch (e) {
        transcriptData = await fetch(base + 'transcript.json').then(r => r.json());
      }
      if (!Array.isArray(transcriptData)) transcriptData = [];

      hasVi = transcriptData.some(s => (s.textVi || '').trim().length > 0);
      if (!hasVi) {
        subLangMode = 'en';
        localStorage.setItem(subLangKey, 'en');
      }

      document.title = meta.video_title;
      const headerTitle = document.getElementById('headerTitle');
      if (headerTitle) headerTitle.textContent = meta.video_title;

      const statDuration = document.getElementById('statDuration');
      if (statDuration) statDuration.textContent = formatDurationShort(meta.duration_seconds || 0);

      const statSubs = document.getElementById('statSubs');
      if (statSubs) statSubs.textContent = meta.sub_lines || 0;

      const statEvents = document.getElementById('statEvents');
      if (statEvents) statEvents.textContent = meta.num_events || 0;

      const videoMeta = document.getElementById('videoMeta');
      if (videoMeta) {
        const parts = [];
        if (meta.channel_title) parts.push('<span>' + escapeHtml(meta.channel_title) + '</span>');
        const pubFmt = formatPublishedAt(meta.published_at);
        if (pubFmt) parts.push('<span> · ' + escapeHtml(pubFmt) + '</span>');
        videoMeta.innerHTML = parts.join(' ');
      }

      const summaryOverview = document.getElementById('summaryOverview');
      if (summaryOverview) {
        const vi = (meta.summary_overview_vi || '').trim();
        const en = (meta.summary_overview || '').trim();
        if (vi || en) {
          let html = '';
          if (vi) html += '<div class="summary-overview" id="summaryVi">' + formatSummaryWithList(vi) + '</div>';
          if (en) html += '<div class="summary-overview" id="summaryEn">' + formatSummaryWithList(en) + '</div>';
          summaryOverview.innerHTML = html;
          const viEl = document.getElementById('summaryVi');
          const enEl = document.getElementById('summaryEn');
          if (viEl && enEl) showVi = (localStorage.getItem(langKey) || 'vi') === 'vi';
          else if (viEl) showVi = true;
          else showVi = false;
          if (viEl) viEl.style.display = showVi ? 'block' : 'none';
          if (enEl) enEl.style.display = showVi ? 'none' : 'block';
        } else {
          summaryOverview.innerHTML = '<span class="empty">Chưa có tóm tắt</span>';
        }
      }

      const timelineContent = document.getElementById('timelineContent');
      if (timelineContent) {
        const highlights = meta.summary_highlights || [];
        if (highlights.length) {
          timelineContent.innerHTML = '<ul class="summary-highlights">' + highlights.map(makeHighlightLi).join('') + '</ul>';
        } else {
          timelineContent.innerHTML = '<span class="empty">Chưa có timeline</span>';
        }
      }

      renderTranscriptList();
      window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
      if (typeof YT !== 'undefined' && YT.Player) {
        onYouTubeIframeAPIReady();
      }
    }

    function initTheme() {
      const saved = localStorage.getItem('yt-player-theme');
      document.documentElement.setAttribute('data-theme', saved || 'dark');
    }

    const SYNC_OFFSET = 2;
    function findSegmentIndex(time) {
      const t = time + SYNC_OFFSET;
      for (let i = 0; i < transcriptData.length; i++) {
        const s = transcriptData[i];
        if (t >= s.start && t < s.start + s.duration) return i;
      }
      if (transcriptData.length === 0) return -1;
      for (let i = transcriptData.length - 1; i >= 0; i--) {
        if (t >= transcriptData[i].start) return i;
      }
      return 0;
    }

    const langKey = 'yt-player-lang';
    const subLangKey = 'yt-player-sublang';
    let showVi = (localStorage.getItem(langKey) || 'vi') === 'vi';
    let subLangMode = localStorage.getItem(subLangKey) || 'bilingual';
    let hasVi = false;

    function toggleSummaryLang() {
      const viEl = document.getElementById('summaryVi');
      const enEl = document.getElementById('summaryEn');
      if (viEl) viEl.style.display = showVi ? 'block' : 'none';
      if (enEl) enEl.style.display = showVi ? 'none' : 'block';
      const langVi = document.getElementById('langVi');
      const langEn = document.getElementById('langEn');
      if (langVi) langVi.classList.toggle('active', showVi);
      if (langEn) langEn.classList.toggle('active', !showVi);
    }

    function formatTs(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function renderTranscriptList() {
      const list = document.getElementById('transcriptList');
      const searchEl = document.getElementById('subSearch');
      if (!list) return;
      const q = (searchEl?.value || '').trim().toLowerCase();
      const filtered = transcriptData
        .map((seg, i) => ({ seg, i }))
        .filter(({ seg }) => {
          if (!q) return true;
          const text = (seg.text || '').toLowerCase();
          const textVi = (seg.textVi || '').toLowerCase();
          return text.includes(q) || textVi.includes(q);
        });
      list.innerHTML = filtered.map(({ seg, i }) => {
        const start = seg.start ?? 0;
        const text = seg.text || '—';
        const textVi = seg.textVi || '';
        const ts = formatTs(start);
        let content = '';
        if (subLangMode === 'bilingual') {
          content = '<div class="line-en">' + escapeHtml(text) + '</div>' + (textVi ? '<div class="line-vi">' + escapeHtml(textVi) + '</div>' : '');
        } else if (subLangMode === 'vi') {
          content = '<div class="line-en">' + escapeHtml(textVi || text) + '</div>';
        } else {
          content = '<div class="line-en">' + escapeHtml(text) + '</div>';
        }
        return '<div class="transcript-item" data-index="' + i + '" data-start="' + start + '" role="button" tabindex="0"><span class="transcript-ts">' + ts + '</span><div class="transcript-text">' + content + '</div></div>';
      }).join('');
      list.querySelectorAll('.transcript-item').forEach(el => {
        el.addEventListener('click', () => {
          const sec = parseFloat(el.getAttribute('data-start'));
          if (player?.seekTo && !isNaN(sec)) player.seekTo(sec, true);
        });
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            const sec = parseFloat(el.getAttribute('data-start'));
            if (player?.seekTo && !isNaN(sec)) player.seekTo(sec, true);
          }
        });
      });
      lastTranscriptIdx = -1;
      if (player?.getCurrentTime) updateTranscript(player.getCurrentTime());
    }

    let lastTranscriptIdx = -1;
    function updateTranscript(time) {
      const idx = findSegmentIndex(time);
      document.querySelectorAll('#transcriptList .transcript-item').forEach(el => {
        const i = parseInt(el.getAttribute('data-index'), 10);
        el.classList.toggle('current', i === idx);
      });
      if (idx !== lastTranscriptIdx) {
        lastTranscriptIdx = idx;
        const list = document.getElementById('transcriptList');
        const currentEl = document.querySelector('#transcriptList .transcript-item.current');
        if (list && currentEl) {
          const paddingTop = parseFloat(getComputedStyle(list).paddingTop) || 0;
          let offset = paddingTop;
          let prev = currentEl.previousElementSibling;
          while (prev) {
            offset += prev.offsetHeight;
            prev = prev.previousElementSibling;
          }
          const scrollTop = offset - (list.clientHeight / 2) + (currentEl.offsetHeight / 2);
          list.scrollTo({ top: Math.max(0, Math.min(scrollTop, list.scrollHeight - list.clientHeight)), behavior: 'smooth' });
        }
      }
    }

    function onYouTubeIframeAPIReady() {
      if (!meta) return;
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: meta.video_id,
        host: 'https://www.youtube-nocookie.com',
        playerVars: { autoplay: 0 },
        events: {
          onReady: function() {
            pollInterval = setInterval(function() {
              if (player && player.getCurrentTime) {
                const t = player.getCurrentTime();
                if (typeof t === 'number' && !isNaN(t)) updateTranscript(t);
              }
            }, 300);
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      init().then(() => {
        document.getElementById('themeToggle')?.addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme') || 'dark';
          const next = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('yt-player-theme', next);
        });

        document.getElementById('langVi')?.addEventListener('click', () => {
          showVi = true;
          localStorage.setItem(langKey, 'vi');
          toggleSummaryLang();
        });
        document.getElementById('langEn')?.addEventListener('click', () => {
          showVi = false;
          localStorage.setItem(langKey, 'en');
          toggleSummaryLang();
        });
        toggleSummaryLang();

        document.querySelectorAll('.sub-lang-btn').forEach(btn => {
          const mode = btn.getAttribute('data-mode');
          const isDisabled = !hasVi && (mode === 'bilingual' || mode === 'vi');
          btn.disabled = isDisabled;
          if (isDisabled) btn.title = 'Đang dịch VI... Refresh khi xong.';
          btn.classList.toggle('active', mode === subLangMode);
          btn.addEventListener('click', () => {
            if (btn.disabled) return;
            subLangMode = mode;
            document.querySelectorAll('.sub-lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            localStorage.setItem(subLangKey, subLangMode);
            renderTranscriptList();
          });
        });

        document.getElementById('subSearch')?.addEventListener('input', () => renderTranscriptList());

        document.querySelectorAll('.tab').forEach(btn => {
          btn.addEventListener('click', () => {
            const tab = btn.getAttribute('data-tab');
            document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('panel-' + tab)?.classList.add('active');
          });
        });

        document.querySelectorAll('.highlight-ts').forEach(el => {
          el.addEventListener('click', () => {
            const sec = parseFloat(el.getAttribute('data-seek'));
            if (player && player.seekTo && !isNaN(sec)) player.seekTo(sec, true);
          });
          el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              const sec = parseFloat(el.getAttribute('data-seek'));
              if (player && player.seekTo && !isNaN(sec)) player.seekTo(sec, true);
            }
          });
        });

        if (window.location.protocol === 'file:') {
          document.getElementById('fileProtocolNotice').style.display = 'block';
        }
        updateTranscript(0);
      });
    });
  </script>
  <div class="container">

        <div class="header-top">
          <div class="logo">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            YouTube Analyzer
          </div>
          <span class="badge">Kết quả</span>
        </div>
        <h1 class="header-title" id="headerTitle"></h1>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>

    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">Thời lượng</div><div class="stat-value" id="statDuration">—</div></div>
      <div class="stat-box"><div class="stat-label">Dòng phụ đề</div><div class="stat-value" id="statSubs">0</div></div>
      <div class="stat-box"><div class="stat-label">Sự kiện chính</div><div class="stat-value" id="statEvents">0</div></div>
    </div>

    <div class="watch-row">
      <div>
        <div class="video-wrap">
          <div id="player"></div>
          <div id="fileProtocolNotice" class="file-notice" style="display:none">
            Video không hiển thị khi mở file trực tiếp. Chạy từ project root: <code>python -m http.server 8765</code> rồi mở <code>http://localhost:8765/player.html?dir=output/xxx</code>
          </div>
        </div>
        <div class="video-meta" id="videoMeta"></div>
      </div>

      <div class="transcript-card">
        <div class="tabs">
          <button class="tab active" data-tab="summary">Tóm tắt</button>
          <button class="tab" data-tab="timeline">Timeline</button>
          <button class="tab" data-tab="subtitles">Phụ đề</button>
        </div>

        <div id="panel-summary" class="tab-panel active">
          <div class="transcript-header">
            <div class="lang-segmented" role="group" aria-label="Ngôn ngữ tóm tắt">
              <button class="active" id="langVi" aria-label="Tóm tắt tiếng Việt">VI</button>
              <button id="langEn" aria-label="Summary in English">EN</button>
            </div>
          </div>
          <div class="summary-text" id="summaryOverview"></div>
        </div>

        <div id="panel-timeline" class="tab-panel">
          <div class="summary-text" id="timelineContent"></div>
        </div>

        <div id="panel-subtitles" class="tab-panel">
          <div class="sub-toolbar">
            <input type="text" class="sub-search" id="subSearch" placeholder="Tìm kiếm trong phụ đề..." aria-label="Tìm kiếm trong phụ đề">
            <div class="sub-lang-group">
              <button class="sub-lang-btn active" id="subLangBilingual" data-mode="bilingual">Song ngữ</button>
              <button class="sub-lang-btn" id="subLangEn" data-mode="en">EN</button>
              <button class="sub-lang-btn" id="subLangVi" data-mode="vi">VI</button>
            </div>
          </div>
          <div class="transcript-area transcript-list" id="transcriptList"></div>
        </div>
      </div>
    </div>
  </div>
</body>
